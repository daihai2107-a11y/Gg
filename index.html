<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHN Express - Quản Lý Đơn Hàng Nâng Cao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ghn: { orange: '#FA5400', dark: '#002D62', hover: '#D94800' } } } }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

    <header class="bg-ghn-dark text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <span class="font-extrabold text-ghn-orange text-base md:text-lg tracking-wider">GHN <span class="text-white">ADMIN PRO</span></span>
            <div class="flex space-x-1 md:space-x-2 items-center">
                <button onclick="switchTab('shop')" id="btn-shop" class="px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-ghn-orange text-white transition">Tạo Đơn</button>
                <button onclick="switchTab('admin')" id="btn-admin" class="px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-gray-800 text-gray-300 transition">Quản Lý & Sửa Đơn</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
        <!-- TAB 1: TẠO ĐƠN VỚI CHỌN ĐỊA CHỈ -->
        <div id="tab-shop" class="space-y-6">
            <div class="bg-white p-5 md:p-8 rounded-2xl shadow-sm space-y-4">
                <h2 class="text-xl font-bold text-ghn-dark border-b pb-3"><i class="fa-solid fa-cart-plus text-ghn-orange mr-2"></i>Tạo Đơn Hàng Mới</h2>
                
                <form onsubmit="createOrder(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Tên Chủ Shop / Kho xuất</label>
                        <input type="text" id="shop-name" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange" placeholder="Kho GHN Hà Nội">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">Tên Người Nhận</label>
                            <input type="text" id="rec-name" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange" placeholder="Nguyễn Văn B">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">SĐT Người Nhận</label>
                            <input type="tel" id="rec-phone" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange" placeholder="0987654321">
                        </div>
                    </div>

                    <!-- KHU VỰC CHỌN ĐỊA CHỈ TỈNH / HUYỆN / XÃ -->
                    <div class="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <label class="block text-sm font-bold text-ghn-dark"><i class="fa-solid fa-location-dot text-ghn-orange mr-1"></i> Chọn Khu Vực Giao Hàng</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <select id="sel-city" onchange="updateDistricts()" class="w-full px-3 py-2.5 border rounded-xl bg-white text-sm outline-none focus:border-ghn-orange font-medium">
                                    <option value="">Chọn Tỉnh/Thành phố</option>
                                    <option value="Hà Nội">Hà Nội</option>
                                    <option value="Hồ Chí Minh">Hồ Chí Minh</option>
                                    <option value="Đà Nẵng">Đà Nẵng</option>
                                    <option value="Hải Phòng">Hải Phòng</option>
                                    <option value="Cần Thơ">Cần Thơ</option>
                                </select>
                            </div>
                            <div>
                                <select id="sel-district" onchange="updateWards()" class="w-full px-3 py-2.5 border rounded-xl bg-white text-sm outline-none focus:border-ghn-orange font-medium">
                                    <option value="">Chọn Quận/Huyện</option>
                                </select>
                            </div>
                            <div>
                                <select id="sel-ward" class="w-full px-3 py-2.5 border rounded-xl bg-white text-sm outline-none focus:border-ghn-orange font-medium">
                                    <option value="">Chọn Phường/Xã</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Số nhà, tên đường cụ thể:</label>
                            <input type="text" id="rec-street" required class="w-full px-4 py-2.5 border rounded-xl bg-white outline-none focus:border-ghn-orange text-sm" placeholder="Ví dụ: Số 15, Ngõ 102 Đường Giải Phóng">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1">Tiền COD (VNĐ)</label>
                        <input type="number" id="order-cod" value="150000" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:border-ghn-orange">
                    </div>

                    <button type="submit" id="btn-submit" class="w-full bg-ghn-orange text-white py-3.5 rounded-xl font-bold shadow hover:bg-ghn-hover transition text-base">
                        LƯU VÀ TẠO ĐƠN HÀNG
                    </button>
                </form>
            </div>

            <div id="success-box" class="hidden bg-white p-5 rounded-2xl shadow-sm space-y-3 border-2 border-green-500">
                <h3 class="font-bold text-green-600 text-base"><i class="fa-solid fa-circle-check mr-1"></i> Tạo đơn thành công!</h3>
                <p class="text-sm text-gray-600">Mã vận đơn của đơn này: <b id="new-id" class="text-ghn-orange font-bold text-xl"></b></p>
                <p class="text-xs text-gray-500">Gửi mã này cho khách, khách gõ vào trang tra cứu là thấy ngay hành trình!</p>
            </div>
        </div>

        <!-- TAB 2: QUẢN LÝ & SỬA ĐƠN -->
        <div id="tab-admin" class="space-y-6 hidden">
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-xl font-bold text-ghn-dark"><i class="fa-solid fa-sliders text-ghn-orange mr-2"></i>Quản Lý & Sửa Đơn Hàng</h2>
                    <button onclick="fetchOrders()" class="bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-xl text-xs font-bold transition"><i class="fa-solid fa-rotate mr-1"></i> Làm mới</button>
                </div>
                <div id="orders-container" class="space-y-4">
                    <p class="text-center text-gray-400 py-6">Đang tải danh sách đơn...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const BIN_ID = "6acfd2e1ac6210605a31bdc0";
        const MASTER_KEY = "$2a$10$.xgqmeAMF8gOzGP.UlKBKu79bsP7f9GxYcPjARVOH6ZFouK5wdAz.";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // Dữ liệu mẫu Tỉnh/Huyện/Xã để chọn nhanh
        const locationData = {
            "Hà Nội": {
                "Quận Ba Đình": ["Phường Phúc Xá", "Phường Trúc Bạch", "Phường Vĩnh Phúc", "Phường Cống Vị"],
                "Quận Hoàn Kiếm": ["Phường Tràng Tiền", "Phường Hàng Bạc", "Phường Hàng Buồm", "Phường Hàng Gai"],
                "Quận Hai Bà Trưng": ["Phường Bách Khoa", "Phường Phố Huế", "Phường Bạch Đằng", "Phường Thanh Nhàn"],
                "Quận Đống Đa": ["Phường Văn Miếu", "Phường Ô Chợ Dừa", "Phường Láng Thượng", "Phường Nam Đồng"]
            },
            "Hồ Chí Minh": {
                "Quận 1": ["Phường Bến Nghé", "Phường Bến Thành", "Phường Cầu Kho", "Phường Đa Kao"],
                "Quận 3": ["Phường Võ Thị Sáu", "Phường 01", "Phường 02", "Phường 03"],
                "Quận Bình Thạnh": ["Phường 12", "Phường 14", "Phường 24", "Phường 25"],
                "TP. Thủ Đức": ["Phường Linh Trung", "Phường Linh Chiểu", "Phường Hiệp Bình Chánh", "Phường Thảo Điền"]
            },
            "Đà Nẵng": {
                "Quận Hải Châu": ["Phường Thạch Thang", "Phường Thanh Bình", "Phường Thuận Phước"],
                "Quận Sơn Trà": ["Phường An Hải Bắc", "Phường Phước Mỹ", "Phường Nại Hiên Đông"]
            }
        };

        function updateDistricts() {
            const city = document.getElementById('sel-city').value;
            const distSelect = document.getElementById('sel-district');
            const wardSelect = document.getElementById('sel-ward');
            
            distSelect.innerHTML = '<option value="">Chọn Quận/Huyện</option>';
            wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';

            if (city && locationData[city]) {
                for (let dist in locationData[city]) {
                    distSelect.innerHTML += `<option value="${dist}">${dist}</option>`;
                }
            }
        }

        function updateWards() {
            const city = document.getElementById('sel-city').value;
            const dist = document.getElementById('sel-district').value;
            const wardSelect = document.getElementById('sel-ward');
            
            wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';

            if (city && dist && locationData[city][dist]) {
                locationData[city][dist].forEach(ward => {
                    wardSelect.innerHTML += `<option value="${ward}">${ward}</option>`;
                });
            }
        }

        let ordersList = [];
        window.addEventListener('DOMContentLoaded', () => { fetchOrders(); });

        function switchTab(tab) {
            document.getElementById('tab-shop').classList.toggle('hidden', tab !== 'shop');
            document.getElementById('tab-admin').classList.toggle('hidden', tab !== 'admin');
            document.getElementById('btn-shop').className = tab === 'shop' ? 'px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-ghn-orange text-white transition' : 'px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-gray-800 text-gray-300 transition';
            document.getElementById('btn-admin').className = tab === 'admin' ? 'px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-ghn-orange text-white transition' : 'px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm bg-gray-800 text-gray-300 transition';
            if(tab === 'admin') fetchOrders();
        }

        async function fetchOrders() {
            try {
                let res = await fetch(API_URL, { headers: { 'X-Master-Key': MASTER_KEY } });
                let data = await res.json();
                ordersList = data.record.orders || [];
                renderOrders();
            } catch(e) { console.error(e); }
        }

        async function createOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = "Đang lưu lên đám mây...";
            btn.disabled = true;

            const street = document.getElementById('rec-street').value;
            const ward = document.getElementById('sel-ward').value;
            const dist = document.getElementById('sel-district').value;
            const city = document.getElementById('sel-city').value;

            // Ghép địa chỉ hoàn chỉnh từ các ô chọn
            const fullAddress = `${street}, ${ward}, ${dist}, ${city}`;

            const newOrder = {
                id: 'GHN' + Math.floor(100000 + Math.random() * 900000),
                shopName: document.getElementById('shop-name').value,
                receiverName: document.getElementById('rec-name').value,
                receiverPhone: document.getElementById('rec-phone').value,
                receiverAddress: fullAddress,
                cod: Number(document.getElementById('order-cod').value),
                status: 'Chờ lấy hàng',
                location: 'Đã tạo đơn hàng thành công tại kho, chờ bưu tá qua lấy',
                timestamp: new Date().toLocaleString('vi-VN')
            };

            ordersList.unshift(newOrder);

            try {
                let res = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify({ orders: ordersList })
                });
                if(res.ok) {
                    btn.innerText = "LƯU VÀ TẠO ĐƠN HÀNG";
                    btn.disabled = false;
                    document.getElementById('new-id').innerText = newOrder.id;
                    document.getElementById('success-box').classList.remove('hidden');
                    e.target.reset();
                    fetchOrders();
                }
            } catch(err) {
                alert('Lỗi lưu đơn hàng!');
                btn.disabled = false;
            }
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            if (ordersList.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-6">Chưa có đơn hàng nào.</p>`;
                return;
            }

            container.innerHTML = ordersList.map(o => `
                <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl space-y-3 shadow-sm">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-gray-400">Mã vận đơn:</span>
                            <h4 class="font-extrabold text-ghn-orange text-base">${o.id}</h4>
                            <span class="text-[10px] text-gray-400 block">Cập nhật: ${o.timestamp}</span>
                        </div>
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${o.status === 'Giao thành công' ? 'bg-green-100 text-green-800' : (o.status === 'Đang giao hàng' ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800')}">${o.status}</span>
                    </div>

                    <!-- KHU VỰC CÓ THỂ SỬA TRỰC TIẾP THÔNG TIN ĐƠN -->
                    <div class="text-xs space-y-2 bg-white p-3 rounded-lg border">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="font-bold text-gray-500 block">Tên người nhận:</label>
                                <input type="text" id="name-${o.id}" value="${o.receiverName}" class="w-full px-2 py-1.5 border rounded bg-gray-50 font-medium">
                            </div>
                            <div>
                                <label class="font-bold text-gray-500 block">SĐT:</label>
                                <input type="text" id="phone-${o.id}" value="${o.receiverPhone}" class="w-full px-2 py-1.5 border rounded bg-gray-50 font-medium">
                            </div>
                        </div>
                        <div>
                            <label class="font-bold text-gray-500 block">Địa chỉ giao hàng:</label>
                            <input type="text" id="address-${o.id}" value="${o.receiverAddress}" class="w-full px-2 py-1.5 border rounded bg-gray-50 font-medium">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="font-bold text-gray-500 block">Tiền COD (đ):</label>
                                <input type="number" id="cod-${o.id}" value="${o.cod}" class="w-full px-2 py-1.5 border rounded bg-gray-50 font-medium">
                            </div>
                            <div>
                                <label class="font-bold text-gray-500 block">Hành trình / Vị trí hiện tại:</label>
                                <input type="text" id="loc-${o.id}" value="${o.location}" class="w-full px-2 py-1.5 border rounded bg-orange-50 text-ghn-dark font-semibold">
                            </div>
                        </div>
                    </div>

                    <!-- NÚT LƯU SỬA VÀ ĐỔI TRẠNG THÁI -->
                    <div class="pt-1 flex flex-wrap gap-2 items-center justify-between">
                        <button onclick="saveEdit('${o.id}')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-900 text-white rounded-lg text-xs font-bold transition"><i class="fa-solid fa-pen-to-square mr-1"></i> Lưu sửa đổi</button>
                        
                        <div class="flex gap-1.5">
                            <button onclick="updateStatus('${o.id}', 'Chờ lấy hàng')" class="px-2 py-1.5 bg-yellow-500 text-white rounded-lg text-xs font-bold">Chờ lấy</button>
                            <button onclick="updateStatus('${o.id}', 'Đang giao hàng')" class="px-2 py-1.5 bg-blue-500 text-white rounded-lg text-xs font-bold">Đang giao</button>
                            <button onclick="updateStatus('${o.id}', 'Giao thành công')" class="px-2 py-1.5 bg-green-500 text-white rounded-lg text-xs font-bold">Thành công</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function saveEdit(id) {
            const item = ordersList.find(x => x.id === id);
            if(item) {
                item.receiverName = document.getElementById(`name-${id}`).value;
                item.receiverPhone = document.getElementById(`phone-${id}`).value;
                item.receiverAddress = document.getElementById(`address-${id}`).value;
                item.cod = Number(document.getElementById(`cod-${id}`).value);
                item.location = document.getElementById(`loc-${id}`).value;
                item.timestamp = new Date().toLocaleString('vi-VN');
            }

            let res = await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify({ orders: ordersList })
            });
            if(res.ok) {
                alert(`Đã cập nhật/sửa thông tin đơn ${id} thành công!`);
                fetchOrders();
            }
        }

        async function updateStatus(id, newStatus) {
            const item = ordersList.find(x => x.id === id);
            if(item) {
                item.status = newStatus;
                item.timestamp = new Date().toLocaleString('vi-VN');
            }
            // Gọi chung hàm lưu luôn sửa đổi & trạng thái
            saveEdit(id);
        }
    </script>
</body>
</html>
